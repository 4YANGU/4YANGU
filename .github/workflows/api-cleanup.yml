name: Keep Vercel Hobby-safe (max 12 functions)

on:
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  cleanup-extra-api-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove extra api files (Hobby plan limit is 12 functions)
        run: |
          set -e
          CHANGED=0
          for f in api/batch.js api/engage.js api/db-client.js api/db-wake.js; do
            if [ -f "$f" ]; then
              git rm -q "$f"
              CHANGED=1
            fi
          done
          if [ "$CHANGED" = "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Remove extra api files so Vercel Hobby plan can deploy (max 12 functions)"
            git push
          else
            echo "api/ is already clean."
          fi
